<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 阅读器</title>
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --bg: #f1f5f9;
  --panel: #ffffff;
  --text: #1e293b;
  --text-light: #64748b;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, .08);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  font-size: 15px;
}

/* ---------------- 顶部工具栏 ---------------- */
.toolbar {
  flex-shrink: 0; height: 54px; padding: 0 16px;
  display: flex; align-items: center; gap: 16px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow); z-index: 100;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--primary); white-space: nowrap; }
.brand svg { width: 20px; height: 20px; fill: currentColor; }
.toolbar-actions { display: flex; gap: 8px; }
.toolbar-info { margin-left: auto; font-size: 13px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px; cursor: pointer;
  font-size: 14px; border: 1px solid var(--border); background: #fff;
  color: var(--text); transition: all .18s; white-space: nowrap; font-family: inherit;
}
.btn:hover { background: #f8fafc; border-color: #cbd5e1; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn svg { width: 15px; height: 15px; fill: currentColor; }

/* ---------------- 主布局 ---------------- */
.main { flex: 1; display: flex; overflow: hidden; position: relative; }

/* ---------------- 侧边栏 ---------------- */
.sidebar {
  display: none; flex-direction: column;
  width: 260px; flex-shrink: 0; background: var(--panel);
  border-right: none;
  overflow: hidden; min-width: 0;
}
.sidebar.show:not(.collapsed) { display: flex; }

.sidebar-header {
  flex-shrink: 0; padding: 8px 10px 8px 14px; font-size: 13px; font-weight: 600;
  color: var(--text-light); background: #f8fafc; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.sidebar-header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.sidebar-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; padding: 0;
  border: none; background: transparent; border-radius: 5px;
  cursor: pointer; color: var(--text-light); transition: all .15s;
  flex-shrink: 0;
}
.sidebar-toggle:hover { background: #e2e8f0; color: var(--primary); }
.sidebar-toggle:active { transform: scale(.92); }
.sidebar-toggle svg { width: 16px; height: 16px; fill: currentColor; }

.tree { flex: 1; overflow: auto; padding: 8px 6px 24px; }
.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px; border-radius: 6px; cursor: pointer;
  font-size: 13.5px; color: var(--text); user-select: none;
  line-height: 1.4; white-space: nowrap; overflow: hidden;
}
.tree-item:hover { background: #f1f5f9; }
.tree-item.active { background: #dbeafe; color: var(--primary-dark); font-weight: 600; }
.tree-item .name { overflow: hidden; text-overflow: ellipsis; }
.tree-item .caret { width: 12px; flex-shrink: 0; color: var(--text-light); font-size: 11px; text-align: center; }
.tree-item .icon { flex-shrink: 0; font-size: 13px; }
.tree-children { padding-left: 14px; }
.empty-tip { padding: 20px; text-align: center; color: var(--text-light); font-size: 13px; }

/* ---------------- 可拖拽分隔条 ---------------- */
.resizer {
  display: none;
  flex: 0 0 6px;
  cursor: col-resize;
  background: var(--border);
  transition: background .15s;
  position: relative;
  z-index: 50;
  touch-action: none;
}
.resizer::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -5px; right: -5px;
}
.resizer:hover,
.resizer.active { background: var(--primary); }
.resizer.active { transition: none; }
.sidebar.show:not(.collapsed) + .resizer { display: block; }
body.resizing,
body.resizing * { cursor: col-resize !important; user-select: none !important; }

/* ---------------- 内容区 ---------------- */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--panel); min-width: 0; }
.content-header {
  flex-shrink: 0; height: 54px; padding: 0 16px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); background: #f8fafc;
}
.file-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.actions { margin-left: auto; display: flex; gap: 8px; }

#btnExpandSidebar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0;
  border: 1px solid var(--border); background: #fff; border-radius: 6px;
  cursor: pointer; color: var(--text-light); transition: all .15s;
  flex-shrink: 0;
}
#btnExpandSidebar:hover { background: #eff6ff; border-color: #bfdbfe; color: var(--primary); }
#btnExpandSidebar:active { transform: scale(.94); }
#btnExpandSidebar svg { width: 15px; height: 15px; fill: currentColor; }
#btnExpandSidebar[hidden] { display: none !important; }

.reader { flex: 1; overflow-y: auto; padding: 32px 44px 120px; line-height: 1.75; scroll-behavior: smooth; }

/* 编辑区 */
.editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#editor {
  flex: 1; width: 100%; border: none; outline: none; resize: none;
  padding: 24px 36px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  font-size: 15px; line-height: 1.75; color: var(--text); background: #fcfcfd;
}
.editor-footer {
  flex-shrink: 0; padding: 6px 16px; font-size: 12.5px; color: var(--text-light);
  border-top: 1px solid var(--border); background: #f8fafc;
  display: flex; justify-content: space-between;
}

/* ---------------- 预览内容样式 ---------------- */
#previewContent > *:first-child { margin-top: 0; }
.reader h1, .reader h2, .reader h3, .reader h4, .reader h5, .reader h6 {
  border-bottom: 1px solid #eee; padding-bottom: 8px; margin: 28px 0 14px;
  line-height: 1.4; scroll-margin-top: 20px;
}
.reader h1 { font-size: 1.9em; color: #0f172a; }
.reader h2 { font-size: 1.5em; color: #0f172a; }
.reader h3 { font-size: 1.25em; }
.reader h4, .reader h5, .reader h6 { font-size: 1.05em; border-bottom: none; }
.reader p { margin: 12px 0; }
.reader a { color: var(--primary); text-decoration: none; }
.reader a:hover { text-decoration: underline; }
.reader img { max-width: 100%; border-radius: 6px; }
.reader blockquote {
  border-left: 4px solid var(--primary); margin: 16px 0; padding: 10px 18px;
  color: var(--text-light); background: #f8fafc; border-radius: 0 6px 6px 0;
}
.reader blockquote p { margin: 6px 0; }
.reader ul, .reader ol { padding-left: 26px; margin: 12px 0; }
.reader li { margin: 5px 0; }
.reader table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 0.95em; }
.reader table th, .reader table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.reader table th { background: #f1f5f9; font-weight: 600; }
.reader pre {
  background: #f6f8fa; padding: 16px; border-radius: 8px;
  overflow-x: auto; border: 1px solid #e8ecf1; margin: 16px 0;
}
.reader pre code { background: transparent; padding: 0; font-size: 0.9em; }
.reader code {
  background: #f0f3f7; padding: 2px 6px; border-radius: 4px;
  font-family: 'Consolas', 'Monaco', monospace; font-size: 0.9em; color: #d6336c;
}
.reader hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.reader .placeholder-tip { color: var(--text-light); text-align: center; margin-top: 100px; }

/* 图片加载失败提示 */
.img-error {
  display: inline-flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 6px;
  padding: 20px 30px; color: var(--text-light); font-size: 13px;
  background: #f8fafc; border: 1px dashed var(--border); border-radius: 8px;
  min-width: 200px; text-align: center;
}

/* ---------------- 目录面板 ---------------- */
.toc-panel {
  position: absolute; top: 54px; right: -340px; width: 320px;
  height: calc(100% - 54px); background: var(--panel);
  border-left: 1px solid var(--border);
  box-shadow: -4px 0 16px rgba(0, 0, 0, .08);
  transition: right .3s ease; overflow-y: auto; padding: 18px; z-index: 60;
}
.toc-panel.open { right: 0; }
.toc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.toc-header h3 { margin: 0; font-size: 15px; }
.toc-close-btn {
  font-size: 20px; line-height: 1; padding: 0 9px; cursor: pointer;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-light); border-radius: 6px;
}
.toc-close-btn:hover { background: #f8fafc; color: var(--text); }
.toc-item {
  display: block; padding: 7px 10px; margin-bottom: 3px; color: var(--text);
  text-decoration: none; border-radius: 6px; cursor: pointer;
  font-size: 13.5px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.toc-item:hover { background: #f1f5f9; color: var(--primary); }
.toc-item.h1 { font-weight: 700; }
.toc-item.h2 { padding-left: 20px; }
.toc-item.h3 { padding-left: 36px; }
.toc-item.h4, .toc-item.h5, .toc-item.h6 { padding-left: 52px; font-size: 0.92em; color: var(--text-light); }
.toc-empty { color: var(--text-light); font-size: 13px; text-align: center; padding: 20px 0; }
.toc-mode-tip {
  font-size: 11.5px; color: var(--text-light); background: #f8fafc;
  border: 1px dashed var(--border); border-radius: 6px;
  padding: 5px 9px; margin-bottom: 12px; line-height: 1.5;
}

/* ---------------- 提示 & 遮罩 ---------------- */
.toast {
  position: fixed; bottom: 26px; left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: #1e293b; color: #fff; padding: 11px 22px; border-radius: 9px;
  opacity: 0; transition: all .3s; z-index: 99999; font-size: 14px;
  max-width: 80vw; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,.2);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.loading-mask {
  position: fixed; inset: 0; background: rgba(255,255,255,.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 99998; font-size: 15px; color: var(--primary); font-weight: 600;
}
.spinner {
  width: 18px; height: 18px; border: 3px solid #cbd5e1; border-top-color: var(--primary);
  border-radius: 50%; animation: spin .7s linear infinite; margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- 响应式 ---------------- */
@media (max-width: 820px) {
  .sidebar {
    position: absolute; top: 0; left: 0; height: 100%; z-index: 80;
    box-shadow: 4px 0 16px rgba(0,0,0,.12);
    border-right: 1px solid var(--border);
  }
  .resizer { display: none !important; }
  .reader { padding: 20px 18px 100px; }
  .toc-panel { width: 84%; right: -90%; }
  .toolbar-info { display: none; }
  .file-title { max-width: 30vw; }
}
</style>
</head>
<body>

<!-- ==================== 顶部工具栏 ==================== -->
<div class="toolbar">
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M4 3h11l5 5v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm10 1.5V9h4.5L14 4.5zM7 12v2h2v5h2v-5h2l-3-3-3 1z"/></svg>
    <span>Markdown 阅读器</span>
  </div>
  <div class="toolbar-actions">
    <button class="btn" id="btnOpenFile">
      <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg>
      打开文件
    </button>
    <button class="btn" id="btnOpenFolder">
      <svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
      打开文件夹
    </button>
  </div>
  <div class="toolbar-info" id="stats">未打开文件</div>
</div>

<!-- ==================== 主体 ==================== -->
<div class="main" id="mainContainer">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span id="sidebarTitle">文件列表</span>
      <div class="sidebar-header-right">
        <span id="fileCount" style="font-weight:400"></span>
        <button class="sidebar-toggle" id="btnCollapseSidebar" title="收起侧边栏 (Ctrl+B)">
          <svg viewBox="0 0 24 24"><path d="M18.41 16.59 13.82 12l4.59-4.59L17 6l-6 6 6 6 1.41-1.41zM11.41 16.59 6.82 12l4.59-4.59L10 6l-6 6 6 6 1.41-1.41z"/></svg>
        </button>
      </div>
    </div>
    <div class="tree" id="fileTree"></div>
  </aside>

  <div class="resizer" id="resizer" title="拖动调整宽度（双击恢复默认）"></div>

  <section class="content" id="contentArea">
    <div class="content-header">
      <button id="btnExpandSidebar" hidden title="展开侧边栏 (Ctrl+B)">
        <svg viewBox="0 0 24 24"><path d="M5.59 7.41 10.18 12l-4.59 4.59L7 18l6-6-6-6-1.41 1.41zM12.59 7.41 17.18 12l-4.59 4.59L14 18l6-6-6-6-1.41 1.41z"/></svg>
      </button>
      <div class="file-title" id="currentFileName">未打开文件</div>

      <div class="actions" id="viewActions">
        <button class="btn" id="btnEdit">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          编辑
        </button>
        <button class="btn" id="btnToc">
          <svg viewBox="0 0 24 24"><path d="M3 5h2v14H3zm4 2h14v2H7zm0 4h14v2H7zm0 4h14v2H7z"/></svg>
          目录
        </button>
        <button class="btn btn-primary" id="btnExport">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          导出 Word
        </button>
      </div>

      <div class="actions" id="editActions" hidden>
        <button class="btn" id="btnEditToc">
          <svg viewBox="0 0 24 24"><path d="M3 5h2v14H3zm4 2h14v2H7zm0 4h14v2H7zm0 4h14v2H7z"/></svg>
          目录
        </button>
        <button class="btn" id="btnCancel">取消</button>
        <button class="btn btn-primary" id="btnSave">
          <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/></svg>
          保存
        </button>
      </div>
    </div>

    <div class="reader" id="previewContent">
      <div class="placeholder-tip">
        <p style="font-size:46px;margin:0">📄</p>
        <p>点击左上角「打开文件」或「打开文件夹」开始阅读</p>
        <p style="font-size:13px">也可以直接把 Markdown 文件拖拽到此处</p>
      </div>
    </div>

    <div class="editor-wrap" id="editorWrap" hidden>
      <textarea id="editor" spellcheck="false" placeholder="在此编辑 Markdown..."></textarea>
      <div class="editor-footer">
        <span id="editorStats"></span>
        <span>Ctrl + S 保存 &nbsp;|&nbsp; Esc 取消</span>
      </div>
    </div>

    <div class="toc-panel" id="tocPanel">
      <div class="toc-header">
        <h3>目录导航</h3>
        <button class="toc-close-btn" id="tocCloseBtn" title="关闭">×</button>
      </div>
      <div id="tocList"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mdwn,.txt" hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>

<script>
/* =====================================================================
 *  一、Markdown 解析器
 * ===================================================================== */
const MD = (() => {
  const MD_EXT = ['md','markdown','mdown','mkd','mkdn','mdwn','mdtxt','mdtext'];

  function isMarkdownFile(name) {
    const i = name.lastIndexOf('.');
    if (i < 0) return false;
    return MD_EXT.includes(name.slice(i + 1).toLowerCase());
  }

  function escapeHTML(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function preprocessMarkdown(md) {
    return md.replace(/<img[\s\S]*?>/gi, (match) => {
      let imgTag = match.replace(/\s+/g, ' ').trim();
      imgTag = imgTag.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
      const srcMatch = imgTag.match(/src\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
      const altMatch = imgTag.match(/alt\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
      let src = srcMatch ? (srcMatch[1] || srcMatch[2] || srcMatch[3] || '') : '';
      const alt = altMatch ? (altMatch[1] || altMatch[2] || altMatch[3] || '') : '';
      if (src) {
        src = src.replace(/^deta\//i, 'data/');
        src = src.replace(/;base64\//i, ';base64,');
        if (src.includes(';base64') && !src.includes(';base64,')) {
          src = src.replace(/;base64/, ';base64,');
        }
      }
      return `<img src="${src}" alt="${alt}" style="max-width:100%">`;
    });
  }

  function parseInline(text) {
    if (text == null) return '';
    let t = String(text);

    const rawImgs = [];
    t = t.replace(/<img\b[^>]*>/gi, (m) => {
      rawImgs.push(m);
      return `\u0000IMG${rawImgs.length - 1}\u0000`;
    });

    t = escapeHTML(t);

    const codes = [];
    t = t.replace(/`([^`]+)`/g, (m, c) => {
      codes.push(c);
      return `\u0000CODE${codes.length - 1}\u0000`;
    });

    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g,
      (m, alt, src) => `<img src="${src}" alt="${alt}" style="max-width:100%">`);
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g,
      (m, txt, href) => `<a href="${href}" target="_blank" rel="noopener">${txt}</a>`);

    t = t.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    t = t.replace(/___([^_]+)___/g, '<strong><em>$1</em></strong>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/(^|[^_\w])_([^_\n]+)_/g, '$1<em>$2</em>');
    t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');

    t = t.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => `<code>${escapeHTML(codes[+i])}</code>`);
    t = t.replace(/\u0000IMG(\d+)\u0000/g, (m, i) => rawImgs[+i]);

    return t;
  }

  function splitRow(line) {
    let t = line.trim();
    if (t.startsWith('|')) t = t.slice(1);
    if (t.endsWith('|')) t = t.slice(0, -1);
    return t.split('|').map(s => s.trim());
  }
  function isTableSep(line) {
    const t = (line || '').trim();
    if (!t || t.indexOf('-') < 0) return false;
    if (!/^\|?[\s:|-]+\|?$/.test(t)) return false;
    const cells = splitRow(t);
    return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c));
  }

  function parseList(lines, start, baseIndent, ordered) {
    const items = [];
    const N = lines.length;
    const itemRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
    let i = start;

    while (i < N) {
      const line = lines[i];

      if (!line.trim()) {
        let j = i + 1;
        while (j < N && !lines[j].trim()) j++;
        if (j >= N) { i = j; break; }
        const peekIndent = lines[j].match(/^(\s*)/)[1].length;
        const peekIsItem = itemRe.test(lines[j]);
        if (peekIndent < baseIndent) break;
        if (!peekIsItem && peekIndent <= baseIndent) break;
        i = j;
        continue;
      }

      const m = line.match(itemRe);
      if (!m) {
        const ind = line.match(/^(\s*)/)[1].length;
        if (items.length && ind >= baseIndent + 2) {
          items[items.length - 1] += ' ' + parseInline(line.trim());
          i++;
          continue;
        }
        break;
      }

      const indent = m[1].length;
      const isOrdered = /^\d/.test(m[2]);

      if (indent < baseIndent) break;

      if (indent > baseIndent) {
        const sub = parseList(lines, i, indent, isOrdered);
        if (sub.next === i) { i++; continue; }
        if (items.length) items[items.length - 1] += sub.html;
        i = sub.next;
        continue;
      }

      if (isOrdered !== ordered) break;

      items.push(parseInline(m[3]));
      i++;
    }

    const tag = ordered ? 'ol' : 'ul';
    const body = items.map(t => `<li>${t}</li>`).join('');
    return { html: `<${tag}>${body}</${tag}>`, next: i };
  }

  function renderBlocks(md) {
    const lines = md.split('\n');
    const N = lines.length;
    let html = '';
    let i = 0;

    while (i < N) {
      const line = lines[i];

      const fence = line.match(/^\s*(`{3,}|~{3,})\s*([^\s`~]*)\s*$/);
      if (fence) {
        const ch = fence[1][0];
        const len = fence[1].length;
        const lang = fence[2] || '';
        const buf = [];
        i++;
        while (i < N) {
          const cm = lines[i].match(/^\s*(`{3,}|~{3,})\s*$/);
          if (cm && cm[1][0] === ch && cm[1].length >= len) { i++; break; }
          buf.push(lines[i]);
          i++;
        }
        html += `<pre><code${lang ? ` class="language-${escapeHTML(lang)}"` : ''}>${escapeHTML(buf.join('\n'))}</code></pre>`;
        continue;
      }

      if (!line.trim()) { i++; continue; }

      if (/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html += '<hr>'; i++; continue; }

      const hm = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (hm) {
        const lv = hm[1].length;
        html += `<h${lv}>${parseInline(hm[2])}</h${lv}>`;
        i++;
        continue;
      }

      if (/^\s{0,3}>/.test(line)) {
        const buf = [];
        while (i < N && /^\s{0,3}>/.test(lines[i])) {
          buf.push(lines[i].replace(/^\s{0,3}>\s?/, ''));
          i++;
        }
        html += `<blockquote>${renderBlocks(buf.join('\n'))}</blockquote>`;
        continue;
      }

      if (line.includes('|') && i + 1 < N && isTableSep(lines[i + 1])) {
        const headers = splitRow(line);
        let tbl = '<table><thead><tr>' +
          headers.map(h => `<th>${parseInline(h)}</th>`).join('') +
          '</tr></thead><tbody>';
        i += 2;
        let rows = 0;
        while (i < N && lines[i].includes('|') && lines[i].trim() && rows < 500) {
          const cells = splitRow(lines[i]);
          tbl += '<tr>' + cells.map(c => `<td>${parseInline(c)}</td>`).join('') + '</tr>';
          i++; rows++;
        }
        tbl += '</tbody></table>';
        html += tbl;
        continue;
      }

      const lm = line.match(/^(\s*)([-*+]|\d+[.)])\s+/);
      if (lm) {
        const res = parseList(lines, i, lm[1].length, /^\d/.test(lm[2]));
        html += res.html;
        i = res.next > i ? res.next : i + 1;
        continue;
      }

      if (/^\s*<[a-zA-Z!/]/.test(line)) {
        const buf = [];
        while (i < N && lines[i].trim()) { buf.push(lines[i]); i++; }
        html += buf.join('\n');
        continue;
      }

      const buf = [];
      while (
        i < N &&
        lines[i].trim() &&
        !/^\s{0,3}(#{1,6}\s|>|```|~~~)/.test(lines[i]) &&
        !/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i]) &&
        !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])
      ) {
        buf.push(lines[i]);
        i++;
      }
      if (buf.length) {
        html += `<p>${parseInline(buf.join('\n'))}</p>`;
      } else {
        html += `<p>${parseInline(lines[i])}</p>`;
        i++;
      }
    }

    return html;
  }

  function parse(markdown) {
    const src = String(markdown == null ? '' : markdown).replace(/\r\n?/g, '\n');
    return renderBlocks(preprocessMarkdown(src));
  }

  return { parse, isMarkdownFile, escapeHTML };
})();

function downloadBlob(blob, filename) {

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function sortTreeNodes(nodes) {
  const cmp = (a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true });
  nodes.sort((a, b) => {
    if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
    return cmp(a, b);
  });
  nodes.forEach(n => { if (n.type === 'dir') sortTreeNodes(n.children); });
}
function findFirstFile(nodes) {
  for (const n of nodes) {
    if (n.type === 'file') return n;
    if (n.type === 'dir') {
      const r = findFirstFile(n.children);
      if (r) return r;
    }
  }
  return null;
}
function countFiles(nodes) {
  let c = 0;
  for (const n of nodes) {
    if (n.type === 'file') c++;
    else c += countFiles(n.children);
  }
  return c;
}

/* 是否为相对路径（需要从本地读取的路径） */
function isRelativeImagePath(src) {
  if (!src || typeof src !== 'string') return false;
  // 排除：协议、绝对路径、锚点
  return !/^([a-z][a-z0-9+.-]*:|\/\/|\/|#|\?)/i.test(src.trim());
}

/* 规范化路径：合并 baseDir 与 src，处理 ./ 和 ../ */
function resolveFullPath(baseDir, src) {
  const combined = (baseDir || '') + src;
  const parts = combined.split(/[\\/]+/);
  const stack = [];
  for (const p of parts) {
    if (p === '' || p === '.') continue;
    if (p === '..') {
      if (stack.length === 0) return null; // 越出根目录
      stack.pop();
    } else {
      stack.push(p);
    }
  }
  return stack.join('/');
}

/* File -> DataURL */
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('读取失败'));
    reader.readAsDataURL(file);
  });
}

/* 从本地获取图片 File 对象 */
async function fetchImageFile(fullPath) {
  // 1) webkitdirectory 模式：从 fileMap 里查
  if (state.fileMap.has(fullPath)) {
    return state.fileMap.get(fullPath);
  }
  // 2) File System Access API：逐级解析目录句柄
  if (state.rootDirHandle) {
    const parts = fullPath.split('/').filter(Boolean);
    if (!parts.length) return null;
    let dir = state.rootDirHandle;
    try {
      for (let i = 0; i < parts.length - 1; i++) {
        dir = await dir.getDirectoryHandle(parts[i]);
      }
      const fh = await dir.getFileHandle(parts[parts.length - 1]);
      return await fh.getFile();
    } catch (e) {
      return null;
    }
  }
  return null;
}

/* 解析单个图片：返回可用的 URL（dataURL / 原样） */
async function resolveImageSrc(src, baseDir) {
  const fullPath = resolveFullPath(baseDir, src);
  if (!fullPath) return src;

  if (state.imageCache.has(fullPath)) {
    return state.imageCache.get(fullPath);
  }

  const file = await fetchImageFile(fullPath);
  if (!file) return src;

  try {
    const dataURL = await fileToDataURL(file);
    state.imageCache.set(fullPath, dataURL);
    return dataURL;
  } catch (e) {
    return src;
  }
}

/* 扫描 Markdown 中所有相对路径图片，替换为 dataURL */
async function resolveMarkdownImages(markdown, baseDir) {
  if (!state.rootDirHandle && state.fileMap.size === 0) {
    // 没有本地文件上下文（例如打开的是单个文件），直接返回
    return markdown;
  }

  // 收集相对路径
  const paths = new Set();

  // Markdown 图片语法: ![alt](src) 或 ![alt](src "title")
  const mdImgRe = /!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+["'][^"']*["'])?\s*\)/g;
  let m;
  while ((m = mdImgRe.exec(markdown)) !== null) {
    const src = m[2];
    if (isRelativeImagePath(src)) paths.add(src);
  }

  // HTML img 标签
  const htmlImgRe = /<img\b[^>]*?\bsrc\s*=\s*(["'])([^"']+)\1[^>]*>/gi;
  while ((m = htmlImgRe.exec(markdown)) !== null) {
    const src = m[2];
    if (isRelativeImagePath(src)) paths.add(src);
  }

  if (paths.size === 0) return markdown;

  // 并行解析
  const pathMap = new Map();
  await Promise.all([...paths].map(async p => {
    try {
      const url = await resolveImageSrc(p, baseDir);
      if (url && url !== p) pathMap.set(p, url);
    } catch (e) { /* 忽略单张图片失败 */ }
  }));

  if (pathMap.size === 0) return markdown;

  // 替换 Markdown 图片语法
  let result = markdown.replace(mdImgRe, (match, alt, src, ...rest) => {
    const url = pathMap.get(src);
    if (!url) return match;
    // 保留原有的 title（如果存在）
    const titleMatch = match.match(/\s+["'][^"']*["']\s*\)$/);
    const title = titleMatch ? titleMatch[0].replace(/\s*\)$/, '') : '';
    return `![${alt}](${url}${title})`;
  });

  // 替换 HTML img 标签
  result = result.replace(htmlImgRe, (match, quote, src) => {
    const url = pathMap.get(src);
    if (!url) return match;
    return match.replace(`${quote}${src}${quote}`, `${quote}${url}${quote}`);
  });

  return result;
}

/* =====================================================================
 *  七、侧边栏宽度拖拽
 * ===================================================================== */
(function initResizer() {
  const MIN_W = 180;
  const DEFAULT_W = 260;
  const MAX_W = () => Math.min(760, window.innerWidth * 0.7);
  const STORAGE_KEY = 'mdReaderSidebarWidth';

  try {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (!isNaN(saved) && saved >= MIN_W) {
      sidebar.style.width = saved + 'px';
    }
  } catch (e) { /* 忽略 */ }

  let resizing = false;
  let startX = 0;
  let startW = 0;
  let activePointerId = null;

  function applyWidth(w) {
    const clamped = Math.max(MIN_W, Math.min(MAX_W(), w));
    sidebar.style.width = clamped + 'px';
    return clamped;
  }

  function onPointerDown(e) {
    if (window.innerWidth <= 820) return;
    if (!sidebar.classList.contains('show')) return;
    if (sidebar.classList.contains('collapsed')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    resizing = true;
    startX = e.clientX;
    startW = sidebar.getBoundingClientRect().width;
    activePointerId = e.pointerId;

    resizerEl.classList.add('active');
    document.body.classList.add('resizing');

    try { resizerEl.setPointerCapture(activePointerId); } catch (err) { /* 忽略 */ }
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!resizing || e.pointerId !== activePointerId) return;
    applyWidth(startW + (e.clientX - startX));
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!resizing || (e && e.pointerId !== activePointerId)) return;
    resizing = false;
    resizerEl.classList.remove('active');
    document.body.classList.remove('resizing');

    if (activePointerId != null) {
      try { resizerEl.releasePointerCapture(activePointerId); } catch (err) { /* 忽略 */ }
      activePointerId = null;
    }

    const w = Math.round(sidebar.getBoundingClientRect().width);
    try { localStorage.setItem(STORAGE_KEY, String(w)); } catch (err) { /* 忽略 */ }
  }

  resizerEl.addEventListener('pointerdown', onPointerDown);
  resizerEl.addEventListener('pointermove', onPointerMove);
  resizerEl.addEventListener('pointerup', onPointerUp);
  resizerEl.addEventListener('pointercancel', onPointerUp);
  resizerEl.addEventListener('lostpointercapture', onPointerUp);

  resizerEl.addEventListener('dblclick', () => {
    sidebar.style.width = DEFAULT_W + 'px';
    try { localStorage.setItem(STORAGE_KEY, String(DEFAULT_W)); } catch (e) {}
    showToast('已恢复默认宽度');
  });

  resizerEl.tabIndex = 0;
  resizerEl.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (window.innerWidth <= 820) return;
    e.preventDefault();
    const step = e.shiftKey ? 40 : 10;
    const dir = e.key === 'ArrowLeft' ? -step : step;
    const w = sidebar.getBoundingClientRect().width;
    const next = applyWidth(w + dir);
    try { localStorage.setItem(STORAGE_KEY, String(Math.round(next))); } catch (err) {}
  });

  window.addEventListener('resize', () => {
    if (!sidebar.classList.contains('show')) return;
    const w = sidebar.getBoundingClientRect().width;
    const max = MAX_W();
    if (w > max) {
      sidebar.style.width = max + 'px';
      try { localStorage.setItem(STORAGE_KEY, String(Math.round(max))); } catch (err) {}
    }
  });
})();

async function buildTreeFromDir(dirHandle, basePath) {
  const dirs = [], files = [];
  const SKIP = ['node_modules', 'dist', 'build', '.git', '__pycache__', '.idea', '.vscode'];

  for await (const entry of dirHandle.values()) {
    const name = entry.name;
    if (name.startsWith('.')) continue;

    if (entry.kind === 'directory') {
      if (SKIP.includes(name)) continue;
      const children = await buildTreeFromDir(entry, basePath + name + '/');
      if (children.length) {
        dirs.push({
          type: 'dir', name,
          path: basePath + name + '/',
          children, open: true
        });
      }
    } else if (MD.isMarkdownFile(name)) {
      files.push({
        type: 'file', name,
        path: basePath + name,
        dirPath: basePath,          // ★ 记录文件所在目录
        handle: entry
      });
    }
  }

  const cmp = (a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true });
  dirs.sort(cmp);
  files.sort(cmp);
  return [...dirs, ...files];
}

function buildTreeFromFiles(files) {
  const root = [];
  for (const f of files) {
    if (!MD.isMarkdownFile(f.name)) continue;
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split('/').filter(Boolean);
    let arr = root, acc = '';

    for (let k = 0; k < parts.length - 1; k++) {
      acc += parts[k] + '/';
      let node = arr.find(n => n.type === 'dir' && n.name === parts[k]);
      if (!node) {
        node = { type: 'dir', name: parts[k], path: acc, children: [], open: true };
        arr.push(node);
      }
      arr = node.children;
    }
    const dirPath = parts.slice(0, -1).join('/');
    arr.push({
      type: 'file',
      name: parts[parts.length - 1],
      path: rel,
      dirPath: dirPath ? dirPath + '/' : '',
      file: f,
      handle: null
    });
  }
  sortTreeNodes(root);
  return root;
}

/* 构造相对路径 -> File 的映射（包含非 markdown 文件，用于解析图片） */
function buildFileMap(allFiles) {
  const map = new Map();
  for (const f of allFiles) {
    const rel = f.webkitRelativePath || f.name;
    if (!rel) continue;
    if (!map.has(rel)) map.set(rel, f);
  }
  return map;
}

/* =====================================================================
 *  九、文件树渲染
 * ===================================================================== */
function renderTree() {
  fileTreeEl.innerHTML = '';
  if (!state.tree.length) {
    fileTreeEl.innerHTML = '<div class="empty-tip">未打开文件夹</div>';
    return;
  }
  fileTreeEl.appendChild(buildTreeEls(state.tree));
  updateActiveInTree();
}

function buildTreeEls(nodes) {
  const frag = document.createDocumentFragment();

  for (const node of nodes) {
    if (node.type === 'dir') {
      const wrap = document.createElement('div');

      const head = document.createElement('div');
      head.className = 'tree-item dir-item';
      head.innerHTML =
        `<span class="caret">${node.open ? '▾' : '▸'}</span>` +
        `<span class="icon">${node.open ? '📂' : '📁'}</span>` +
        `<span class="name">${MD.escapeHTML(node.name)}</span>`;
      head.title = node.path;

      const childBox = document.createElement('div');
      childBox.className = 'tree-children';
      childBox.style.display = node.open ? '' : 'none';
      childBox.appendChild(buildTreeEls(node.children));

      head.addEventListener('click', () => {
        node.open = !node.open;
        head.querySelector('.caret').textContent = node.open ? '▾' : '▸';
        head.querySelector('.icon').textContent = node.open ? '📂' : '📁';
        childBox.style.display = node.open ? '' : 'none';
      });

      wrap.append(head, childBox);
      frag.appendChild(wrap);

    } else {
      const item = document.createElement('div');
      item.className = 'tree-item file-item';
      item.dataset.path = node.path;
      item.title = node.path;
      item.innerHTML =
        `<span class="caret"></span>` +
        `<span class="icon">📄</span>` +
        `<span class="name">${MD.escapeHTML(node.name)}</span>`;
      item.addEventListener('click', () => openTreeNode(node));
      frag.appendChild(item);
    }
  }
  return frag;
}

function updateActiveInTree() {
  document.querySelectorAll('.file-item').forEach(el => {
    el.classList.toggle('active', el.dataset.path === state.currentPath);
  });
}

/* =====================================================================
 *  十、打开树中的文件
 * ===================================================================== */
async function openTreeNode(node) {
  if (state.editing && state.dirty) {
    if (!confirm('当前文件有未保存的修改，确定要放弃并切换文件吗？')) return;
  }

  try {
    let text;
    if (state.cache.has(node.path)) {
      text = state.cache.get(node.path);
    } else if (node.handle) {
      const file = await node.handle.getFile();
      text = await file.text();
    } else if (node.file) {
      text = await node.file.text();
    } else {
      throw new Error('无法读取该文件');
    }

    applyDocument(node.name, text, {
      handle: node.handle || null,
      file: node.file || null,
      path: node.path,
      dirPath: node.dirPath || ''
    });

    if (window.innerWidth <= 820) {
      sidebar.classList.add('collapsed');
      updateSidebarToggleUI();
    }

  } catch (e) {
    showToast('打开失败：' + e.message);
  }
}

function applyDocument(name, text, opts = {}) {
  state.currentName = name;
  state.currentPath = opts.path || name;
  state.currentHandle = opts.handle || null;
  state.currentFile = opts.file || null;
  state.currentFileDir = opts.dirPath || '';   // ★ 图片相对路径的基准目录
  state.content = text;
  state.dirty = false;

  exitEditMode(true);
  closeTOC();
  renderPreview();      // 异步
  updateHeader();
  updateActiveInTree();
}

function updateHeader() {
  currentFileNameEl.textContent = state.currentName || '未打开文件';
  const lines = state.content ? state.content.split('\n').length : 0;
  statsEl.textContent = state.currentName
    ? `${state.currentName} · ${state.content.length} 字符 · ${lines} 行`
    : '未打开文件';
}

/* =====================================================================
 *  十一、预览渲染 + 目录
 * ===================================================================== */
let renderToken = 0;   // 防止旧渲染覆盖新渲染

async function renderPreview() {
  const myToken = ++renderToken;
  const mdText = state.content;
  const baseDir = state.currentFileDir;

  // ★ 异步解析相对路径图片
  let resolvedText;
  try {
    resolvedText = await resolveMarkdownImages(mdText, baseDir);
  } catch (e) {
    resolvedText = mdText;
  }

  // 如果已经切换到其他文件，丢弃本次结果
  if (myToken !== renderToken) return;

  previewContent.innerHTML = MD.parse(resolvedText);
  previewContent.scrollTop = 0;

  // 图片加载失败时显示占位提示
  previewContent.querySelectorAll('img').forEach(img => {
    img.addEventListener('error', () => {
      if (img.dataset.errorHandled) return;
      img.dataset.errorHandled = '1';
      const tip = document.createElement('div');
      tip.className = 'img-error';
      tip.innerHTML = '🖼️<br>图片无法显示<br><span style="font-size:11px">' +
        MD.escapeHTML((img.getAttribute('src') || '').slice(0, 80)) + '</span>';
      img.replaceWith(tip);
    }, { once: true });
  });

  if (tocPanel.classList.contains('open')) generateTOC();
}

function generateTOC() {
  if (state.editing) {
    generateEditTOC();
  } else {
    generatePreviewTOC();
  }
}

function generatePreviewTOC() {
  tocList.innerHTML = '';
  const headings = previewContent.querySelectorAll('h1, h2, h3, h4, h5, h6');

  if (!headings.length) {
    tocList.innerHTML = '<div class="toc-empty">当前文档没有标题</div>';
    return;
  }

  let idx = 0;
  headings.forEach(heading => {
    idx++;
    if (!heading.id) heading.id = 'heading-' + idx;

    const item = document.createElement('a');
    item.href = 'javascript:void(0)';
    item.className = 'toc-item ' + heading.tagName.toLowerCase();
    item.textContent = heading.innerText;
    item.title = heading.innerText;
    item.addEventListener('click', (e) => {
      e.preventDefault();
      heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
      tocList.querySelectorAll('.toc-item').forEach(a => a.style.background = '');
      item.style.background = '#eff6ff';
    });
    tocList.appendChild(item);
  });
}

function generateEditTOC() {
  tocList.innerHTML = '';

  const tip = document.createElement('div');
  tip.className = 'toc-mode-tip';
  tip.textContent = '点击标题可跳转到编辑区对应位置';
  tocList.appendChild(tip);

  const text = editorEl.value;
  const lines = text.split('\n');
  const headings = [];
  let offset = 0;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (m) {
      let title = m[2].trim();
      title = title.replace(/\*\*|__|\*|_|`|~~/g, '').trim();
      if (!title) title = '(无标题)';
      headings.push({
        level: m[1].length,
        text: title,
        pos: offset
      });
    }
    offset += line.length + 1;
  }

  if (!headings.length) {
    const empty = document.createElement('div');
    empty.className = 'toc-empty';
    empty.textContent = '当前文档没有标题';
    tocList.appendChild(empty);
    return;
  }

  headings.forEach(h => {
    const item = document.createElement('a');
    item.href = 'javascript:void(0)';
    item.className = 'toc-item h' + h.level;
    item.textContent = h.text;
    item.title = h.text;
    item.addEventListener('click', (e) => {
      e.preventDefault();
      jumpToInEditor(h.pos);
      closeTOC();
    });
    tocList.appendChild(item);
  });
}

function jumpToInEditor(pos) {
  const len = editorEl.value.length;
  const target = Math.max(0, Math.min(pos, len));

  editorEl.focus();
  try {
    editorEl.setSelectionRange(target, target);
  } catch (e) { /* 忽略 */ }

  requestAnimationFrame(() => {
    const before = editorEl.value.slice(0, target);
    const lineIndex = (before.match(/\n/g) || []).length;

    const cs = window.getComputedStyle(editorEl);
    const lineHeight = parseFloat(cs.lineHeight) || 24;
    const padTop = parseFloat(cs.paddingTop) || 0;
    const targetTop = padTop + lineIndex * lineHeight;
    const viewH = editorEl.clientHeight;

    if (targetTop < editorEl.scrollTop + lineHeight * 0.5 ||
        targetTop > editorEl.scrollTop + viewH - lineHeight * 2) {
      editorEl.scrollTop = Math.max(0, targetTop - viewH / 3);
    }
  });
}

function toggleTOC() {
  if (tocPanel.classList.contains('open')) {
    closeTOC();
  } else {
    generateTOC();
    tocPanel.classList.add('open');
  }
}
function closeTOC() {
  tocPanel.classList.remove('open');
}

/* =====================================================================
 *  十二、编辑 / 保存
 * ===================================================================== */
function enterEditMode() {
  if (!state.currentName && !state.content) {
    showToast('请先打开一个 Markdown 文件');
    return;
  }
  state.editing = true;
  state.dirty = false;

  editorEl.value = state.content;
  updateEditorStats();

  previewContent.hidden = true;
  editorWrap.hidden = false;
  viewActions.hidden = true;
  editActions.hidden = false;

  if (tocPanel.classList.contains('open')) generateTOC();

  editorEl.focus();
  editorEl.setSelectionRange(0, 0);
  editorEl.scrollTop = 0;
}

function exitEditMode(silent) {
  state.editing = false;
  state.dirty = false;

  previewContent.hidden = false;
  editorWrap.hidden = true;
  viewActions.hidden = false;
  editActions.hidden = true;

  if (!silent) {
    renderPreview();  // 异步重新渲染（图片也会重新解析）
  } else if (tocPanel.classList.contains('open')) {
    generateTOC();
  }
}

function cancelEdit() {
  if (state.dirty && !confirm('放弃未保存的修改？')) return;
  exitEditMode(false);
  showToast('已取消编辑');
}

function updateEditorStats() {
  const t = editorEl.value;
  $('editorStats').textContent = `${t.length} 字符 | ${t.split('\n').length} 行`;
}

async function ensureWritePermission(handle) {
  if (!handle.queryPermission) return true;
  const opts = { mode: 'readwrite' };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  } catch (e) {
    return false;
  }
}

async function saveCurrent() {
  const text = editorEl.value;

  try {
    if (state.currentHandle) {
      const granted = await ensureWritePermission(state.currentHandle);
      if (granted) {
        const writable = await state.currentHandle.createWritable();
        await writable.write(text);
        await writable.close();
        showToast('✅ 已保存到原文件');
      } else {
        downloadBlob(
          new Blob([text], { type: 'text/markdown;charset=utf-8' }),
          state.currentName || 'untitled.md'
        );
        showToast('未获得写入权限，已下载副本');
      }
    } else {
      downloadBlob(
        new Blob([text], { type: 'text/markdown;charset=utf-8' }),
        state.currentName || 'untitled.md'
      );
      showToast('浏览器不支持直接写回，已下载修改后的文件');
    }

    state.content = text;
    if (state.currentPath) state.cache.set(state.currentPath, text);
    state.dirty = false;

    exitEditMode(false);
    updateHeader();

  } catch (e) {
    showToast('保存失败：' + e.message);
  }
}

/* =====================================================================
 *  十三、导出 Word
 * ===================================================================== */
async function exportWord() {
  if (!state.content) {
    showToast('请先打开一个 Markdown 文件');
    return;
  }

  // 编辑模式下，使用编辑器内容；同时需要重新解析图片路径
  let htmlContent;
  if (state.editing) {
    const resolved = await resolveMarkdownImages(editorEl.value, state.currentFileDir);
    htmlContent = MD.parse(resolved);
  } else {
    // 预览模式下，预览 DOM 中的图片已经是 dataURL，可以直接使用
    htmlContent = previewContent.innerHTML;
  }

  const css = `
    body { font-family: '微软雅黑', 'Microsoft YaHei', Arial, sans-serif; line-height: 1.7; font-size: 11pt; color: #1e293b; }
    h1, h2, h3, h4, h5, h6 { color: #2563eb; margin-top: 18pt; margin-bottom: 8pt; }
    h1 { font-size: 20pt; border-bottom: 1px solid #ddd; padding-bottom: 6pt; }
    h2 { font-size: 16pt; border-bottom: 1px solid #eee; padding-bottom: 4pt; }
    h3 { font-size: 13pt; }
    p { margin: 6pt 0; }
    a { color: #2563eb; }
    img { max-width: 100%; }
    table { border-collapse: collapse; width: 100%; margin: 10pt 0; }
    table th, table td { border: 1px solid #cbd5e1; padding: 5pt 8pt; }
    table th { background: #f1f5f9; }
    pre { background: #f6f8fa; padding: 8pt; border: 1px solid #e2e8f0; font-family: Consolas, monospace; font-size: 9.5pt; white-space: pre-wrap; word-wrap: break-word; }
    code { font-family: Consolas, monospace; background: #f6f8fa; padding: 1pt 3pt; font-size: 9.5pt; }
    pre code { background: transparent; padding: 0; }
    blockquote { border-left: 4px solid #2563eb; margin: 8pt 0; padding: 6pt 12pt; color: #555; background: #f8fafc; }
    hr { border: none; border-top: 1px solid #ddd; }
  `;

  const html =
    `<html xmlns:o='urn:schemas-microsoft-com:office:office' ` +
    `xmlns:w='urn:schemas-microsoft-com:office:word' ` +
    `xmlns='http://www.w3.org/TR/REC-html40'>` +
    `<head><meta charset='utf-8'><title>${MD.escapeHTML(state.currentName)}</title>` +
    `<style>${css}</style></head><body>${htmlContent}</body></html>`;

  const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  const baseName = (state.currentName || 'markdown文档').replace(/\.[^.]+$/, '');
  downloadBlob(blob, baseName + '.doc');

  showToast('Word 文档导出成功！');
}

/* =====================================================================
 *  十四、事件绑定
 * ===================================================================== */
$('btnOpenFile').addEventListener('click', openFilePicker);
$('btnOpenFolder').addEventListener('click', openFolder);
$('btnEdit').addEventListener('click', enterEditMode);
$('btnToc').addEventListener('click', toggleTOC);
$('btnEditToc').addEventListener('click', toggleTOC);
$('btnExport').addEventListener('click', exportWord);
$('btnSave').addEventListener('click', saveCurrent);
$('btnCancel').addEventListener('click', cancelEdit);
$('tocCloseBtn').addEventListener('click', closeTOC);

$('fileInput').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) openByLocalFile(f);
  e.target.value = '';
});

$('folderInput').addEventListener('change', async (e) => {
  const allFiles = Array.from(e.target.files || []);
  e.target.value = '';
  if (!allFiles.length) return;

  showLoading('正在构建文件列表...');
  const tree = buildTreeFromFiles(allFiles);
  hideLoading();

  if (!tree.length) {
    showToast('该文件夹下没有找到 Markdown 文件');
    return;
  }

  // ★ 建立文件映射（含图片等非 md 文件），用于相对路径图片解析
  state.fileMap = buildFileMap(allFiles);
  state.rootDirHandle = null;
  clearImageCache();

  state.tree = tree;
  state.cache.clear();
  showSidebar('文件列表');
  fileCountEl.textContent = countFiles(tree) + ' 个文件';
  renderTree();

  const first = findFirstFile(tree);
  if (first) openTreeNode(first);
});

let editTocTimer = null;
editorEl.addEventListener('input', () => {
  state.dirty = true;
  updateEditorStats();

  if (tocPanel.classList.contains('open') && state.editing) {
    clearTimeout(editTocTimer);
    editTocTimer = setTimeout(() => {
      if (!state.editing || !tocPanel.classList.contains('open')) return;
      const keepScroll = tocPanel.scrollTop;
      generateTOC();
      tocPanel.scrollTop = keepScroll;
    }, 500);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'b' || e.key === 'B')) {
    e.preventDefault();
    toggleSidebar();
    return;
  }
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    exportWord();
  }
  if (state.editing) {
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      saveCurrent();
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      cancelEdit();
    }
  } else {
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      showToast('提示：点击「编辑」后可保存修改');
    }
  }
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.body.style.background = '#e8eef7';
});
document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.body.style.background = '';
});
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  document.body.style.background = '';

  const allFiles = Array.from(e.dataTransfer.files || []);
  const mdFiles = allFiles.filter(f => MD.isMarkdownFile(f.name));
  if (!mdFiles.length) {
    showToast('未检测到 Markdown 文件');
    return;
  }

  if (allFiles.length === 1 && !mdFiles[0].webkitRelativePath) {
    openByLocalFile(mdFiles[0]);
    return;
  }

  const tree = buildTreeFromFiles(allFiles);
  if (!tree.length) { showToast('未检测到 Markdown 文件'); return; }

  state.fileMap = buildFileMap(allFiles);
  state.rootDirHandle = null;
  clearImageCache();

  state.tree = tree;
  state.cache.clear();
  showSidebar('拖入的文件');
  fileCountEl.textContent = countFiles(tree) + ' 个文件';
  renderTree();
  const first = findFirstFile(tree);
  if (first) openTreeNode(first);
});

window.addEventListener('beforeunload', (e) => {
  if (state.editing && state.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

updateSidebarToggleUI();
</script>
